name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio-generator/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with uv
        run: uv sync --all-extras --dev

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Django Tests
        env:
          SECRET_KEY: test-secret-key-for-ci-pipeline
          DEBUG: "True"
          GEMINI_API_KEY: fake-ci-key
        run: uv run python manage.py test portfolio_engine.tests --verbosity=2

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./portfolio-generator/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: portfolio-generator/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Vitest component tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

